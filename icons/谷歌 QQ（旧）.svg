<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- 圆环三色：底(绿)、左(黄)、顶右(红) -->
  <g fill="none" stroke-width="40" stroke-linecap="butt">
    <!-- 绿色（底部：45° 至 157°） -->
    <path d="M 166.33,166.33 A 74,74 0 0,1 45.88,142.91" stroke="#34A853" />
    <!-- 黄色（左侧：155° 至 257°） -->
    <path d="M 46.93,145.27 A 74,74 0 0,1 97.35,41.90" stroke="#FBBC05" />
    <!-- 红色（顶部及右上：255° 至 45°） -->
    <path d="M 94.85,42.52 A 74,74 0 0,1 166.33,166.33" stroke="#EA4335" />
  </g>

  <!-- 蓝色一撇（独占第 4 种颜色，跨过红绿交界，不与底色重复） -->
  <polygon points="153.60,128.14 218.65,193.19 193.19,218.65 128.14,153.60" fill="#4285F4" />
</svg>